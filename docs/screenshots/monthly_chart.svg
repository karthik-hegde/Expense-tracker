<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Device Phone Outer Border -->
  <rect x="5" y="5" width="370" height="770" rx="36" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="356" height="756" rx="30" fill="#F8FAFC"/>

  <!-- Status Bar / Top Notch -->
  <rect x="140" y="18" width="100" height="18" rx="9" fill="#0F172A"/>
  <text x="32" y="32" font-size="11" font-weight="600" fill="#334155">9:41</text>

  <!-- Top App Bar -->
  <g transform="translate(24, 48)">
    <text x="0" y="18" font-size="18" font-weight="700" fill="#2563EB">←</text>
    <text x="24" y="18" font-size="18" font-weight="700" fill="#0F172A">Expense Analytics</text>
    <text x="24" y="32" font-size="11" font-weight="500" fill="#64748B">November 2026 breakdown</text>
  </g>

  <!-- Mode Selector Chips (Expenses vs Income vs Net Report) -->
  <g transform="translate(24, 94)">
    <rect x="0" y="0" width="332" height="38" rx="12" fill="#F1F5F9"/>
    <rect x="6" y="4" width="96" height="30" rx="8" fill="#2563EB"/>
    <text x="24" y="24" font-size="11" font-weight="700" fill="#FFFFFF">Expenses</text>

    <rect x="108" y="4" width="80" height="30" rx="8" fill="#FFFFFF"/>
    <text x="126" y="24" font-size="11" font-weight="600" fill="#475569">Income</text>

    <rect x="194" y="4" width="132" height="30" rx="8" fill="#FFFFFF"/>
    <text x="214" y="24" font-size="11" font-weight="600" fill="#475569">Net Report</text>
  </g>

  <!-- Monthly vs Annual Tabs -->
  <g transform="translate(24, 142)">
    <text x="20" y="18" font-size="13" font-weight="700" fill="#2563EB">Monthly Report</text>
    <rect x="16" y="26" width="128" height="3" fill="#2563EB" rx="1.5"/>

    <text x="200" y="18" font-size="13" font-weight="500" fill="#64748B">Annual Report</text>
  </g>

  <!-- Month Navigator Banner -->
  <g transform="translate(24, 180)">
    <rect x="0" y="0" width="332" height="36" rx="10" fill="#F1F5F9"/>
    <text x="14" y="22" font-size="14" font-weight="700" fill="#2563EB">‹</text>
    <text x="110" y="22" font-size="13" font-weight="700" fill="#0F172A">November 2026</text>
    <text x="310" y="22" font-size="14" font-weight="700" fill="#2563EB">›</text>
  </g>

  <!-- Monthly Pie Chart Card -->
  <g transform="translate(24, 226)">
    <rect x="0" y="0" width="332" height="240" rx="16" fill="#F1F5F9"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#0F172A">Monthly Category Distribution</text>
    <text x="16" y="38" font-size="10" font-weight="500" fill="#64748B">Tap any slice or category to filter expenses</text>

    <!-- Vector Pie Chart -->
    <g transform="translate(166, 128)">
      <!-- Slice 1: Shopping (44% - Magenta/Pink #EC4899) -->
      <path d="M0,0 L0,-65 A65,65 0 0,1 63,16 Z" fill="#EC4899" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Slice 2: Food & Dining (33% - Gold/Amber #F59E0B) -->
      <path d="M0,0 L63,16 A65,65 0 0,1 -20,62 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Slice 3: Transport (13% - Sky Blue #38BDF8) -->
      <path d="M0,0 L-20,62 A65,65 0 0,1 -61,-22 Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Slice 4: Bills (10% - Purple #8B5CF6) -->
      <path d="M0,0 L-61,-22 A65,65 0 0,1 0,-65 Z" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Center Hole for Donut/Pie styling -->
      <circle cx="0" cy="0" r="28" fill="#F1F5F9"/>
      <text x="0" y="4" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">₹14.8k</text>
    </g>

    <!-- Highlight Selected Category Pill -->
    <rect x="24" y="198" width="284" height="30" rx="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="1"/>
    <text x="32" y="218" font-size="12">🛍️</text>
    <text x="50" y="218" font-size="11" font-weight="700" fill="#0F172A">Shopping</text>
    <text x="120" y="218" font-size="11" font-weight="700" fill="#BE185D">₹6,500.00 (43.8%)</text>
    <text x="272" y="218" font-size="10" font-weight="700" fill="#2563EB">Clear</text>
  </g>

  <!-- Category Breakup Header -->
  <text x="24" y="486" font-size="12" font-weight="700" fill="#475569">Category Breakup (4)</text>
  <text x="240" y="486" font-size="11" font-weight="700" fill="#2563EB">Total: ₹14,850.00</text>

  <!-- Category Breakup Item 1: Shopping -->
  <g transform="translate(24, 498)">
    <rect x="0" y="0" width="332" height="68" rx="12" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="28" cy="34" r="18" fill="#F472B6" fill-opacity="0.3"/>
    <text x="21" y="39" font-size="15">🛍️</text>

    <text x="56" y="26" font-size="13" font-weight="700" fill="#0F172A">Shopping</text>
    <text x="56" y="42" font-size="10" font-weight="500" fill="#64748B">2 transactions</text>

    <text x="250" y="26" font-size="13" font-weight="700" fill="#0F172A">₹6,500.00</text>
    <rect x="264" y="32" width="52" height="18" rx="5" fill="#EC4899" fill-opacity="0.25"/>
    <text x="274" y="45" font-size="10" font-weight="700" fill="#9D174D">43.8%</text>

    <!-- Progress bar -->
    <rect x="56" y="52" width="260" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="56" y="52" width="114" height="6" rx="3" fill="#EC4899"/>
  </g>

  <!-- Category Breakup Item 2: Food & Dining -->
  <g transform="translate(24, 574)">
    <rect x="0" y="0" width="332" height="68" rx="12" fill="#F1F5F9"/>
    <circle cx="28" cy="34" r="18" fill="#FDE68A"/>
    <text x="21" y="39" font-size="15">🍔</text>

    <text x="56" y="26" font-size="13" font-weight="700" fill="#0F172A">Food &amp; Dining</text>
    <text x="56" y="42" font-size="10" font-weight="500" fill="#64748B">1 transaction</text>

    <text x="250" y="26" font-size="13" font-weight="700" fill="#0F172A">₹4,850.00</text>
    <rect x="264" y="32" width="52" height="18" rx="5" fill="#F59E0B" fill-opacity="0.25"/>
    <text x="274" y="45" font-size="10" font-weight="700" fill="#B45309">32.7%</text>

    <rect x="56" y="52" width="260" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="56" y="52" width="85" height="6" rx="3" fill="#F59E0B"/>
  </g>

  <!-- Bottom Navigation Bar Placeholder -->
  <g transform="translate(24, 680)">
    <rect x="0" y="0" width="332" height="52" rx="16" fill="#1E293B"/>
    <text x="42" y="32" font-size="12" font-weight="600" fill="#94A3B8">💳 Tracker</text>
    <text x="142" y="32" font-size="12" font-weight="700" fill="#38BDF8">📊 Analytics</text>
    <text x="242" y="32" font-size="12" font-weight="600" fill="#94A3B8">⚙️ Settings</text>
  </g>

</svg>
