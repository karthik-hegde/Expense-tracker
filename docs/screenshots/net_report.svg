<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Device Phone Outer Border -->
  <rect x="5" y="5" width="370" height="770" rx="36" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="12" y="12" width="356" height="756" rx="30" fill="#F8FAFC"/>

  <!-- Status Bar / Top Notch -->
  <rect x="140" y="18" width="100" height="18" rx="9" fill="#0F172A"/>
  <text x="32" y="32" font-size="11" font-weight="600" fill="#334155">9:41</text>

  <!-- Top App Bar -->
  <g transform="translate(24, 48)">
    <text x="0" y="18" font-size="18" font-weight="700" fill="#2563EB">←</text>
    <text x="24" y="18" font-size="18" font-weight="700" fill="#0F172A">Net Financial Analytics</text>
    <text x="24" y="32" font-size="11" font-weight="500" fill="#64748B">November 2026 breakdown</text>
  </g>

  <!-- Mode Selector Chips (Expenses vs Income vs Net Report) -->
  <g transform="translate(24, 94)">
    <rect x="0" y="0" width="332" height="38" rx="12" fill="#F1F5F9"/>
    <rect x="6" y="4" width="90" height="30" rx="8" fill="#FFFFFF"/>
    <text x="24" y="24" font-size="11" font-weight="600" fill="#475569">Expenses</text>

    <rect x="102" y="4" width="80" height="30" rx="8" fill="#FFFFFF"/>
    <text x="120" y="24" font-size="11" font-weight="600" fill="#475569">Income</text>

    <rect x="188" y="4" width="138" height="30" rx="8" fill="#1565C0"/>
    <text x="220" y="24" font-size="11" font-weight="700" fill="#FFFFFF">Net Report</text>
  </g>

  <!-- Monthly vs Annual Tabs -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="160" height="28" fill="none"/>
    <text x="20" y="18" font-size="13" font-weight="700" fill="#1565C0">Monthly Report</text>
    <rect x="16" y="26" width="128" height="3" fill="#1565C0" rx="1.5"/>

    <text x="200" y="18" font-size="13" font-weight="500" fill="#64748B">Annual Report</text>
  </g>

  <!-- Net Monthly Summary Card -->
  <g transform="translate(24, 180)">
    <rect x="0" y="0" width="332" height="124" rx="16" fill="#E8F5E9"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#1B5E20">Net Balance (November 2026)</text>

    <!-- Entries Badge -->
    <rect x="252" y="10" width="64" height="20" rx="8" fill="#81C784" fill-opacity="0.3"/>
    <text x="264" y="24" font-size="11" font-weight="600" fill="#1B5E20">6 entries</text>

    <!-- Net Savings Headline -->
    <text x="16" y="58" font-size="26" font-weight="800" fill="#2E7D32">+₹60,150.00</text>

    <!-- Total Income Sub-Card -->
    <rect x="16" y="74" width="144" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="24" y="88" font-size="10" font-weight="500" fill="#64748B">Total Income</text>
    <text x="24" y="104" font-size="12" font-weight="700" fill="#2E7D32">+₹75,000.00</text>

    <!-- Total Expenses Sub-Card -->
    <rect x="172" y="74" width="144" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="180" y="88" font-size="10" font-weight="500" fill="#64748B">Total Expenses</text>
    <text x="180" y="104" font-size="12" font-weight="700" fill="#DC2626">-₹14,850.00</text>
  </g>

  <!-- Monthly Net Trend Bar Chart Card -->
  <g transform="translate(24, 316)">
    <rect x="0" y="0" width="332" height="186" rx="16" fill="#F1F5F9"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#0F172A">Monthly Net Trend (Income vs Expenses)</text>
    <text x="16" y="36" font-size="10" font-weight="500" fill="#64748B">Jan - Dec monthly net savings or deficit</text>

    <!-- 12 Monthly Bar Chart Elements -->
    <!-- Jan (+45k) -->
    <text x="18" y="72" font-size="8" font-weight="600" fill="#166534">+45k</text>
    <rect x="22" y="76" width="12" height="64" rx="3" fill="#2E7D32"/>
    <text x="25" y="152" font-size="10" font-weight="700" fill="#0F172A">J</text>

    <!-- Feb (+52k) -->
    <text x="44" y="62" font-size="8" font-weight="600" fill="#166534">+52k</text>
    <rect x="48" y="66" width="12" height="74" rx="3" fill="#2E7D32"/>
    <text x="51" y="152" font-size="10" font-weight="700" fill="#0F172A">F</text>

    <!-- Mar (-8k Deficit Red) -->
    <text x="72" y="120" font-size="8" font-weight="600" fill="#DC2626">-8k</text>
    <rect x="74" y="124" width="12" height="16" rx="3" fill="#DC2626"/>
    <text x="76" y="152" font-size="10" font-weight="700" fill="#0F172A">M</text>

    <!-- Apr (+38k) -->
    <text x="98" y="82" font-size="8" font-weight="600" fill="#166534">+38k</text>
    <rect x="100" y="86" width="12" height="54" rx="3" fill="#2E7D32"/>
    <text x="102" y="152" font-size="10" font-weight="700" fill="#0F172A">A</text>

    <!-- May (+61k) -->
    <text x="122" y="50" font-size="8" font-weight="600" fill="#166534">+61k</text>
    <rect x="126" y="54" width="12" height="86" rx="3" fill="#2E7D32"/>
    <text x="128" y="152" font-size="10" font-weight="700" fill="#0F172A">M</text>

    <!-- Jun (+49k) -->
    <text x="150" y="66" font-size="8" font-weight="600" fill="#166534">+49k</text>
    <rect x="152" y="70" width="12" height="70" rx="3" fill="#2E7D32"/>
    <text x="155" y="152" font-size="10" font-weight="700" fill="#0F172A">J</text>

    <!-- Jul (-12k Deficit Red) -->
    <text x="174" y="116" font-size="8" font-weight="600" fill="#DC2626">-12k</text>
    <rect x="178" y="120" width="12" height="20" rx="3" fill="#DC2626"/>
    <text x="182" y="152" font-size="10" font-weight="700" fill="#0F172A">J</text>

    <!-- Aug (+55k) -->
    <text x="202" y="58" font-size="8" font-weight="600" fill="#166534">+55k</text>
    <rect x="204" y="62" width="12" height="78" rx="3" fill="#2E7D32"/>
    <text x="207" y="152" font-size="10" font-weight="700" fill="#0F172A">A</text>

    <!-- Sep (+67k Peak) -->
    <text x="228" y="42" font-size="8" font-weight="600" fill="#166534">+67k</text>
    <rect x="230" y="46" width="12" height="94" rx="3" fill="#2E7D32"/>
    <text x="233" y="152" font-size="10" font-weight="700" fill="#0F172A">S</text>

    <!-- Oct (+42k) -->
    <text x="254" y="76" font-size="8" font-weight="600" fill="#166534">+42k</text>
    <rect x="256" y="80" width="12" height="60" rx="3" fill="#2E7D32"/>
    <text x="258" y="152" font-size="10" font-weight="700" fill="#0F172A">O</text>

    <!-- Nov (+60k) -->
    <text x="280" y="52" font-size="8" font-weight="600" fill="#166534">+60k</text>
    <rect x="282" y="56" width="12" height="84" rx="3" fill="#2E7D32"/>
    <text x="285" y="152" font-size="10" font-weight="700" fill="#0F172A">N</text>

    <!-- Dec (0k) -->
    <rect x="308" y="137" width="12" height="3" rx="1" fill="#CBD5E1"/>
    <text x="311" y="152" font-size="10" font-weight="500" fill="#94A3B8">D</text>
  </g>

  <!-- Integrated Transactions Section Header -->
  <text x="24" y="522" font-size="12" font-weight="700" fill="#475569">Transactions in Net Report (6)</text>

  <!-- Income Row 1 -->
  <g transform="translate(24, 534)">
    <rect x="0" y="0" width="332" height="60" rx="12" fill="#F1F5F9"/>
    <circle cx="28" cy="30" r="18" fill="#DCFCE7"/>
    <text x="21" y="35" font-size="15">💼</text>
    <text x="56" y="24" font-size="12" font-weight="700" fill="#0F172A">TECH CORP PVT LTD - Salary</text>
    <text x="56" y="40" font-size="10" font-weight="500" fill="#64748B">Bank • 30 Nov 2026</text>
    <text x="220" y="34" font-size="13" font-weight="700" fill="#2E7D32">+₹75,000.00</text>
    <path d="M304,24 h12 m-8,0 v10 m4,-10 v10 m-7,-12 h10" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Expense Row 2 -->
  <g transform="translate(24, 602)">
    <rect x="0" y="0" width="332" height="60" rx="12" fill="#F1F5F9"/>
    <circle cx="28" cy="30" r="18" fill="#FCE7F3"/>
    <text x="21" y="35" font-size="15">🛍️</text>
    <text x="56" y="24" font-size="12" font-weight="700" fill="#0F172A">AMAZON PAY IN E</text>
    <text x="56" y="40" font-size="10" font-weight="500" fill="#64748B">Card • 25 Nov 2026</text>
    <text x="228" y="34" font-size="13" font-weight="700" fill="#DC2626">-₹1,362.03</text>
    <path d="M304,24 h12 m-8,0 v10 m4,-10 v10 m-7,-12 h10" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Bottom Navigation Bar Placeholder -->
  <g transform="translate(24, 680)">
    <rect x="0" y="0" width="332" height="52" rx="16" fill="#1E293B"/>
    <text x="42" y="32" font-size="12" font-weight="600" fill="#94A3B8">💳 Tracker</text>
    <text x="142" y="32" font-size="12" font-weight="700" fill="#38BDF8">📊 Analytics</text>
    <text x="242" y="32" font-size="12" font-weight="600" fill="#94A3B8">⚙️ Settings</text>
  </g>

</svg>
